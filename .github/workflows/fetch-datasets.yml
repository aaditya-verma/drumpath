name: fetch-datasets
# Manual only. Downloads public datasets used at build time and exposes them as a short-lived
# workflow artifact. Nothing here is committed to the repo.
on: workflow_dispatch
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Groove MIDI Dataset (Google Magenta, CC BY 4.0)
        run: |
          mkdir -p out
          curl -fsSL -o out/groove-v1.0.0-midionly.zip https://storage.googleapis.com/magentadata/datasets/groove/groove-v1.0.0-midionly.zip
          echo "651cbc524ffb891be1a3e46d89dc82a1cecb09a57c748c7b45b844c4841dcc1e  out/groove-v1.0.0-midionly.zip" | sha256sum -c
      - uses: actions/upload-artifact@v4
        with:
          name: datasets
          path: out/
          retention-days: 3
