<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0e1115">
<title>DrumPath</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/css/app.css?v=15">
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand-row">
    <div class="brand" data-act="home">DrumPath</div>
    <span class="sync" data-nav="kit" title="Kit connection"><span class="dot" id="mdot"></span><span id="mtxt">Kit not connected</span></span>
    <span class="sync hidden" id="dchip" data-act="drivechip" title="Google Drive sync"><span class="dot" id="ddot"></span><span id="dtxt">Drive</span></span>
    <span class="sp"></span>
    <button class="pbtn" id="themebtn" data-act="theme" title="Theme"></button>
    <button class="pbtn" id="searchbtn" data-act="search" title="Search"></button>
  </div>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</div></header>
<nav class="bnav" id="bnav" aria-label="Sections"></nav>
<div class="dock"><button class="dk-b dk-back" id="backb" data-act="back" title="Back"></button><button class="dk-b dk-nav" data-act="more" title="All sections"></button></div>
<div class="scrim hidden" id="scrim" data-act="more"></div>
<div class="msheet hidden" id="msheet" role="dialog" aria-label="All sections"></div>
<main id="view"></main>

<div id="prac" class="hidden">
  <div class="ptop">
    <button class="ghost" data-act="pexit" title="Close">✕</button>
    <div class="ptitle" id="ptitle"></div>
    <div class="exsel" id="exsel"></div>
    <button class="sm ghost" id="subbtn" data-act="subclick">Sub-click: Off</button>
    <span id="simwrap"></span>
    <span id="stretchwrap"></span>
    <div class="passdots" id="pdots"></div>
    <div class="bpmc"><button data-act="bpm-">−</button><span id="bpmv">60</span><button data-act="bpm+">+</button><small class="mut">BPM</small></div>
    <button class="pri" id="go" data-act="go">Start</button>
  </div>
  <div class="cvwrap"><canvas id="cv"></canvas><div id="pfeed"></div><div id="result" class="hidden"></div></div>
  <div id="pads"></div>
</div>

<script src="lessons/lib.js?v=15"></script>
<script src="lessons/L0-2.js?v=15"></script>
<script src="lessons/L3.js?v=15"></script>
<script src="lessons/songs.js?v=15"></script>
<script src="src/js/01-data.js?v=15"></script>
<script src="src/js/02-state.js?v=15"></script>
<script src="src/js/02b-storage.js?v=15"></script>
<script src="src/js/02c-drive.js?v=15"></script>
<script src="src/js/03-midi.js?v=15"></script>
<script src="src/js/04-engine.js?v=15"></script>
<script src="src/js/05-shell.js?v=15"></script>
<script src="src/js/06-charts-agg.js?v=15"></script>
<script src="src/js/07-home.js?v=15"></script>
<script src="src/js/08-lessons.js?v=15"></script>
<script src="src/js/09-progress.js?v=15"></script>
<script src="src/js/10-compare.js?v=15"></script>
<script src="src/js/midi-analyse.js?v=15"></script>
<script src="src/js/11a-songs-model.js?v=15"></script>
<script src="src/js/11-songs.js?v=15"></script>
<script src="src/js/11b-analyse.js?v=15"></script>
<script src="src/js/13-studio.js?v=15"></script>
<script src="src/js/14-layout-check.js?v=15"></script>
<script src="src/js/12-kit-settings.js?v=15"></script>
<script src="src/js/99-events.js?v=15"></script>
</body>
</html>
